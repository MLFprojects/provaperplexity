<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multicolor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff, #06d6a0, #ffbe0b, #fb5607);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
    }
    .card {
      width: min(90%, 720px);
      padding: 4rem 2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 28px;
      background: rgba(255, 255, 255, .14);
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, .25);
    }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 7rem); letter-spacing: -.08em; }
    p { font-size: clamp(1rem, 2vw, 1.3rem); opacity: .92; }
    .dots { display: flex; justify-content: center; gap: .8rem; margin-top: 2rem; }
    .dot { width: 42px; height: 42px; border-radius: 50%; animation: bounce 1.3s ease-in-out infinite; }
    .dot:nth-child(1) { background: #ff006e; }
    .dot:nth-child(2) { background: #ffbe0b; animation-delay: .15s; }
    .dot:nth-child(3) { background: #06d6a0; animation-delay: .3s; }
    .dot:nth-child(4) { background: #3a86ff; animation-delay: .45s; }
    .dot:nth-child(5) { background: #8338ec; animation-delay: .6s; }
    @keyframes gradient { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes bounce { 50% { transform: translateY(-16px) rotate(18deg); } }
  </style>
</head>
<body>
  <main class="card">
    <h1>CIAO!</h1>
    <p>Una pagina che non ha paura dei colori.</p>
    <div class="dots" aria-label="Palette multicolore">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </main>
</body>
</html>
